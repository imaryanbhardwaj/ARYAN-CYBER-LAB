name: Build ARYAN CYBER LAB APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip ARYAN_CYBER_LAB_Android_Project.zip -d project
      - name: Fix Java compatibility
        run: sed -i 's/VERSION_1_8/VERSION_17/g' project/aryan_cyber_lab/app/build.gradle
      - name: Build APK
        working-directory: project/aryan_cyber_lab
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARYAN-CYBER-LAB-APK
          path: project/aryan_cyber_lab/app/build/outputs/apk/debug/app-debug.apk
